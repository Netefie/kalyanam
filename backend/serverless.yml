# Deploys the Kalyanam API to AWS Lambda — zero-cost architecture (see
# /Users/kavin/.claude/plans/dapper-popping-firefly.md for the full plan and
# the free-tier reasoning behind every choice below):
#
# - A Function URL instead of API Gateway: API Gateway's free requests are a
#   12-month tier that eventually bills; Function URLs never charge per
#   request.
# - No VPC: a VPC-attached Lambda needs a NAT Gateway (~$32/mo) for internet
#   egress. Staying out of a VPC keeps this at $0 — the tradeoff is Atlas M0's
#   IP allowlist has to stay open (Lambda's egress IPs are dynamic), so SCRAM
#   auth is the only real door.
# - 7-day log retention so CloudWatch storage stays inside the 5 GB/mo
#   always-free ingest instead of accumulating forever.
# - `AWS_PROFILE=kalyanam npm run deploy` (see package.json) — this profile's
#   IAM policy is scoped to resources named kalyanam-api-*, matching this
#   service name, so it cannot touch any other AWS resource.
service: kalyanam-api
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  # Node 20 reached EOL on 2026-04-30; Lambda stopped patching nodejs20.x then and
  # blocks *updates* to functions still on it from 2027-03-03, so this has to move
  # before then or an urgent fix becomes undeployable.
  #
  # Serverless Framework v3's local schema validator still lists only up to
  # nodejs20.x, so `print`/`package`/`deploy` emit "Invalid configuration ...
  # provider.runtime" here. That warning is cosmetic: configValidationMode defaults
  # to `warn`, so the value passes through verbatim and the rendered CloudFormation
  # carries "Runtime": "nodejs22.x" (verified in
  # .serverless/cloudformation-template-update-stack.json). AWS accepts it; only the
  # local validator is out of date. Do not "fix" the warning by reverting to 20.x.
  runtime: nodejs22.x
  region: ap-south-1
  memorySize: 256
  timeout: 30
  logRetentionInDays: 7
  # Nothing here needs a Lambda version/alias (no canary routing, no
  # provisioned concurrency) — turning this off removes one
  # AWS::Lambda::Version resource per function from the stack.
  versionFunctions: false
  # Keeps the deployment-artifacts S3 bucket from growing unbounded — only
  # the current + previous zip are kept instead of every deploy ever made.
  deploymentBucket:
    maxPreviousDeploymentArtifacts: 1
  environment:
    NODE_ENV: production
    CORS_ORIGIN: ${env:CORS_ORIGIN}
    MONGODB_URI: ${env:MONGODB_URI}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
    SMTP_HOST: ${env:SMTP_HOST, ''}
    SMTP_PORT: ${env:SMTP_PORT, '465'}
    SMTP_SECURE: ${env:SMTP_SECURE, 'true'}
    SMTP_USER: ${env:SMTP_USER, ''}
    SMTP_PASS: ${env:SMTP_PASS, ''}
    MAIL_FROM: ${env:MAIL_FROM, ''}
    MAIL_REPLY_TO: ${env:MAIL_REPLY_TO, ''}
    MAIL_ADMIN_TO: ${env:MAIL_ADMIN_TO, ''}
    MAIL_TEST_TO: ${env:MAIL_TEST_TO, ''}
    MAIL_ENABLED: ${env:MAIL_ENABLED, 'true'}
    MAIL_DRY_RUN: ${env:MAIL_DRY_RUN, 'false'}
    MAIL_MAX_RETRIES: ${env:MAIL_MAX_RETRIES, '3'}
    SITE_URL: ${env:SITE_URL, ''}
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET}
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET}
    PAYMENT_CURRENCY: ${env:PAYMENT_CURRENCY, 'INR'}
    BOOKING_HOLD_MINUTES: ${env:BOOKING_HOLD_MINUTES, '15'}
    HOTEL_TIMEZONE: ${env:HOTEL_TIMEZONE, 'Asia/Kolkata'}
    BOOKING_MAX_NIGHTS: ${env:BOOKING_MAX_NIGHTS, '30'}
    BOOKING_MAX_ROOMS: ${env:BOOKING_MAX_ROOMS, '5'}
    BOOKING_MAX_ADVANCE_DAYS: ${env:BOOKING_MAX_ADVANCE_DAYS, '365'}

package:
  patterns:
    - '!.env*'
    - '!scripts/**'
    - '!README.md'

functions:
  api:
    handler: src/lambda.handler
    # No `cors:` block here on purpose. Function URL CORS and the Express `cors()`
    # middleware in src/app.js BOTH emit Access-Control-Allow-Origin, and once each
    # layer allowed the production origin the response carried the header twice -
    # which browsers reject outright, failing every cross-origin request. The two
    # also disagreed: allowCredentials was false here while app.js sets
    # credentials: true.
    #
    # app.js wins because its origin callback checks CORS_ORIGIN at request time and
    # so takes a comma-separated list, which this literal list cannot. Dropping this
    # block also means OPTIONS preflights now reach the function instead of being
    # answered by the Lambda service - fine, `cors()` handles them.
    url: true

  sweepBookings:
    handler: src/handlers/sweepers.sweepBookings
    events:
      - schedule: rate(5 minutes)

  sweepMail:
    handler: src/handlers/sweepers.sweepMail
    events:
      - schedule: rate(10 minutes)

resources:
  Resources:
    # Serverless Framework emits only the `lambda:InvokeFunctionUrl` permission. That alone is
    # NOT enough: Lambda answers the CORS preflight itself (OPTIONS returned 200) but refused
    # every real request with 403 "Forbidden ... Function URL authorization", because actually
    # running the function additionally needs `lambda:InvokeFunction`. Verified by adding it by
    # hand - /api/rooms went 403 -> 200 - and this is what SAM generates for an equivalent
    # public Function URL (see the netefie-backend stack).
    #
    # `InvokedViaFunctionUrl: true` is the important half: it is a CloudFormation-only property
    # (the `aws lambda add-permission` CLI cannot express it) that restricts this to calls
    # arriving through the public Function URL. Granting bare `lambda:InvokeFunction` to "*"
    # without it would let any AWS principal invoke the function directly, bypassing the URL.
    ApiUrlPublicInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Ref ApiLambdaFunction
        Principal: '*'
        InvokedViaFunctionUrl: true
